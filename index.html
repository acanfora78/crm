<title>SMM Business CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: SaaS shell — black sidebar on the left, sticky top bar with global search, scrolling work area. Monochrome ink with semantic status colours only. */
:root{
  --bg:#f5f5f3; --surface:#ffffff; --surface-2:#f0f0ed; --surface-3:#e9e9e5;
  --line:#e3e3df; --line-strong:#cfcfca;
  --ink:#0f0f0e; --ink-2:#55554f; --ink-3:#8b8b84;
  --accent:#0f0f0e; --accent-ink:#ffffff;
  --side-bg:#0f0f0e; --side-ink:#ededea; --side-ink-2:#9a9a94; --side-hover:#1d1d1b; --side-active:#2a2a27; --side-line:#232321;
  --ok:#1d7a3b; --ok-soft:#e5f3e9; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#c0362f; --bad-soft:#fbe7e5; --info:#2a62b8; --info-soft:#e6eefa;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --bar:#2c2c29; --bar-2:#a9a9a2;
  --shadow:0 1px 2px rgba(15,15,14,.05),0 8px 24px rgba(15,15,14,.06);
  --overlay:rgba(15,15,14,.38);
  --f-ui:"Geist","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0a; --surface:#141413; --surface-2:#1b1b1a; --surface-3:#232321;
  --line:#252523; --line-strong:#353532;
  --ink:#f1f1ee; --ink-2:#b4b4ad; --ink-3:#7d7d77;
  --accent:#f1f1ee; --accent-ink:#0b0b0a;
  --side-bg:#080807; --side-ink:#ededea; --side-ink-2:#8e8e88; --side-hover:#161615; --side-active:#22221f; --side-line:#1d1d1b;
  --ok:#55c374; --ok-soft:#14261a; --warn:#e3a33a; --warn-soft:#2a1f0d; --bad:#f07a73; --bad-soft:#2c1514; --info:#6aa3ef; --info-soft:#121d2d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --bar:#d6d6d0; --bar-2:#5c5c57;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --overlay:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0b0a; --surface:#141413; --surface-2:#1b1b1a; --surface-3:#232321;
  --line:#252523; --line-strong:#353532;
  --ink:#f1f1ee; --ink-2:#b4b4ad; --ink-3:#7d7d77;
  --accent:#f1f1ee; --accent-ink:#0b0b0a;
  --side-bg:#080807; --side-ink:#ededea; --side-ink-2:#8e8e88; --side-hover:#161615; --side-active:#22221f; --side-line:#1d1d1b;
  --ok:#55c374; --ok-soft:#14261a; --warn:#e3a33a; --warn-soft:#2a1f0d; --bad:#f07a73; --bad-soft:#2c1514; --info:#6aa3ef; --info-soft:#121d2d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --bar:#d6d6d0; --bar-2:#5c5c57;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --overlay:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

/* Shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--side-line);z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--side-ink);color:var(--side-bg);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.04em}
.brand b{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;color:var(--side-ink-2);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--side-ink-2);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--side-ink-2);font-size:13.5px;font-weight:500}
.nav a svg{width:17px;height:17px;flex:none}
.nav a:hover{background:var(--side-hover);color:var(--side-ink)}
.nav a.active{background:var(--side-active);color:var(--side-ink)}
.nav .badge{margin-left:auto;font-size:11px;font-family:var(--f-mono);padding:1px 7px;border-radius:99px;background:var(--side-active);color:var(--side-ink)}
.nav .badge.alert{background:#c0362f;color:#fff}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--side-line);font-size:12px;color:var(--side-ink-2);display:flex;flex-direction:column;gap:8px}
.store-chip{display:flex;align-items:center;gap:8px;color:var(--side-ink);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:#3fb763}.dot.warn{background:#e3a33a}.dot.bad{background:#e5534b}
.side-foot a{color:var(--side-ink-2)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.btn.menu-btn{display:none}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:0 12px 0 36px;outline:none}
.search input:focus{border-color:var(--line-strong);background:var(--surface)}
.search>svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--ink-3)}
.search kbd{position:absolute;right:10px;top:9px;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--surface)}
.search-results{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:420px;overflow:auto;padding:6px;z-index:50}
.sr-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:8px 8px 4px}
.sr-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:7px;cursor:pointer}
.sr-item:hover,.sr-item.sel{background:var(--surface-2)}
.sr-item small{color:var(--ink-3);display:block}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:24px;letter-spacing:-.02em;margin:0;font-weight:600;text-wrap:balance}
.page-head p{margin:4px 0 0;color:var(--ink-2);max-width:68ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.88}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.icon{width:32px;padding:0;justify-content:center;height:32px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input,.select,textarea.input{height:36px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 10px;outline:none;min-width:0}
textarea.input{height:auto;min-height:90px;padding:9px 10px;resize:vertical;line-height:1.45}
.input:focus,.select:focus{border-color:var(--ink-2)}
.select{padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .input{flex:1 1 220px;max-width:340px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .c{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-left:4px}

/* Cards, KPIs */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.card-h h2,.card-h h3{font-size:14px;margin:0;font-weight:600;letter-spacing:-.005em}
.card-h .sub{color:var(--ink-3);font-size:12px}
.card-b{padding:14px 16px 16px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.kpi{background:var(--surface);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.02em;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .h{font-size:11.5px;color:var(--ink-3)}
.kpi.hl .v{color:var(--bad)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.chart{width:100%;min-height:220px;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:13px;text-align:center;padding:20px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.funnel{display:flex;flex-direction:column;gap:7px}
.f-row{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:12.5px}
.f-bar{height:20px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.f-bar span{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.f-row.lost .f-bar span{background:var(--bar-2)}
.f-row .n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.welcome{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;padding:22px;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.welcome h2{margin:0 0 6px;font-size:19px;letter-spacing:-.015em}
.welcome p{margin:0;color:var(--ink-2);max-width:60ch}
.welcome ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.welcome li{display:flex;gap:10px;align-items:center;counter-increment:s}
.welcome li::before{content:counter(s);width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:11px;font-family:var(--f-mono);flex:none;color:var(--ink-2)}

/* Lists & tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--ink-2);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th .arr{font-size:10px;margin-left:3px;color:var(--ink)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl td.r,.tbl .money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .muted{color:var(--ink-3)}
.tbl .acts{white-space:nowrap;text-align:right}
.cell-main{font-weight:500}
.cell-sub{color:var(--ink-3);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.dark{background:var(--ink);color:var(--surface)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .row{justify-content:center;margin-top:14px}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:500}
.li .s{font-size:12px;color:var(--ink-3)}
.li .ico{width:32px;height:32px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.li .ico svg{width:16px;height:16px}
.li.over .ico{background:var(--bad-soft);color:var(--bad)}
.li.done .t{text-decoration:line-through;color:var(--ink-3)}
.li-click{cursor:pointer}
.li-click:hover{background:var(--surface-2)}
.sumbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.sumbar>div{background:var(--surface);padding:12px 16px}
.sumbar .l{font-size:12px;color:var(--ink-2)}
.sumbar .v{font-family:var(--f-mono);font-size:19px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sumbar .h{font-size:11.5px;color:var(--ink-3)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-size:12.5px;margin-bottom:16px}
.note svg{width:16px;height:16px;flex:none;margin-top:1px}
.note.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.note.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.note b{color:inherit}

/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;min-height:60vh}
.col{flex:0 0 268px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 200px)}
.col-h{padding:12px 12px 8px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.col-h .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.col-h .t .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);font-weight:500;margin-left:auto}
.col-h .v{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.col-b{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:80px;flex:1}
.col.over{outline:2px dashed var(--ink-3);outline-offset:-3px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 10px 8px;cursor:grab;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.kc:hover{border-color:var(--line-strong)}
.kc.dragging{opacity:.4}
.kc .t{font-weight:600;font-size:13px;line-height:1.3}
.kc .s{font-size:12px;color:var(--ink-3)}
.kc .m{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kc .val{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.kc .mv{display:flex;gap:2px}
.kc .mv button{border:0;background:var(--surface-2);width:24px;height:22px;border-radius:5px;cursor:pointer;color:var(--ink-2);display:grid;place-items:center}
.kc .mv button:hover{background:var(--surface-3);color:var(--ink)}
.kc .mv svg{width:13px;height:13px}
.stage-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-head h2{margin:0 8px 0 0;font-size:17px;font-weight:600;text-transform:capitalize;min-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);font-size:11.5px;color:var(--ink-2);padding:7px 8px;font-weight:500}
.cal .day{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal .day:hover{background:var(--surface-2)}
.cal .day.out{background:var(--bg);color:var(--ink-3)}
.cal .day .dn{font-size:12px;font-family:var(--f-mono);color:var(--ink-2);display:flex;justify-content:space-between}
.cal .day.today .dn b{background:var(--ink);color:var(--surface);border-radius:5px;padding:0 5px}
.ev{font-size:11.5px;border-radius:5px;padding:2px 6px;background:var(--ink);color:var(--surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:left;cursor:pointer;width:100%}
.ev.fu{background:var(--surface-3);color:var(--ink-2)}
.ev.cancel{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through}
.ev.donee{background:var(--ok-soft);color:var(--ok)}
.ev-more{font-size:11px;color:var(--ink-3)}

/* Drawer / modal */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:640px;display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.modal.small{max-width:440px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px;font-weight:600}
.modal-b{padding:18px 20px}

.drawer-h .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.drawer-h h2{margin:0;font-size:20px;letter-spacing:-.015em;font-weight:600;overflow-wrap:anywhere}
.drawer-h .meta{color:var(--ink-2);font-size:13px}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px 40px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.sec h4{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:500;display:flex;justify-content:space-between;align-items:center}

.kv div{min-width:0}
.kv dt{font-size:11.5px;color:var(--ink-3);margin:0}
.kv dd{margin:2px 0 0;overflow-wrap:anywhere;display:flex;gap:6px;align-items:center}
.copy{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:2px;border-radius:4px;display:inline-grid}

.notes-box{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px;font-size:13px;color:var(--ink-2)}
.timeline{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line-strong);margin-left:4px}
.timeline div{position:relative;padding:0 0 12px 16px;font-size:12.5px}
.timeline div::before{content:"";position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-2)}
.timeline small{color:var(--ink-3);display:block}
.mini{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.mini .li{padding:9px 12px}
.progress{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;display:flex}

.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;z-index:90;max-width:min(380px,calc(100vw - 32px))}

.toast.bad{background:var(--bad);color:#fff}
.toast button{margin-left:auto;background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px}

.menu{position:absolute;right:0;top:42px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:210px;z-index:50}

.menu button:hover{background:var(--surface-2)}
.menu svg{width:16px;height:16px;color:var(--ink-2)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--ink-3);gap:10px}

.data-grid ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2)}
.data-grid li{margin-bottom:4px}

const fmtDateLong = s => fmtDate(s,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function daysTo(s){ const d=parseISO(s); if(!d) return null; return Math.round((d-parseISO(todayISO()))/86400000); }
function relDay(n){ if(n==null) return ''; if(n<-1) return `Scaduto da ${-n} gg`; if(n===-1) return 'Ieri'; if(n===0) return 'Oggi'; if(n===1) return 'Domani'; return `Tra ${n} gg`; }
function addDays(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); }
const eur0 = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0,minimumFractionDigits:0});
const eur2 = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const num0 = new Intl.NumberFormat('it-IT');
function money(v){ v=+v||0; return (Number.isInteger(v)?eur0:eur2).format(v); }
function moneyShort(v){ v=+v||0; const a=Math.abs(v); if(a>=1e6) return (v/1e6).toLocaleString('it-IT',{maximumFractionDigits:1})+' M€'; if(a>=1e3) return (v/1e3).toLocaleString('it-IT',{maximumFractionDigits:1})+'k €'; return Math.round(v)+' €'; }
const pct = v => (isFinite(v)?(v*100).toLocaleString('it-IT',{maximumFractionDigits:1}):'0')+'%';
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const keyNorm = s => norm(s).replace(/[^a-z0-9]/g,'');
function parseNum(v){
  if(v==null) return NaN; if(typeof v==='number') return v;
  let s=String(v).replace(/[€\s ]/g,'').replace(/eur/i,''); if(!s) return NaN;
  const lc=s.lastIndexOf(','), ld=s.lastIndexOf('.');
  if(lc>-1 && ld>-1){ if(lc>ld) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(lc>-1){ s=s.replace(/\./g,'').replace(',','.'); }
  else if(ld>-1 && /^-?\d{1,3}(\.\d{3})+$/.test(s)){ s=s.replace(/\./g,''); }
  const n=Number(s); return isFinite(n)?n:NaN;
}
function parseAnyDate(v){
  v=String(v||'').trim(); if(!v) return '';
  if(parseISO(v)) return v;
  let m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/.exec(v);
  if(m){ let y=+m[3]; if(y<100) y+=2000; const s=y+'-'+pad(m[2])+'-'+pad(m[1]); return parseISO(s)?s:null; }
  m=/^(\d{4})-(\d{2})-(\d{2})[T ]/.exec(v); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  return null;
}
const urlOf = s => { s=String(s||'').trim(); if(!s) return ''; return /^https?:\/\//i.test(s)?s:'https://'+s; };
const igUrl = s => { s=String(s||'').trim(); if(!s) return ''; if(/instagram\.com/i.test(s)) return urlOf(s); return 'https://instagram.com/'+s.replace(/^@/,''); };
const igHandle = s => { s=String(s||'').trim(); const m=/instagram\.com\/([^/?#]+)/i.exec(s); return m?'@'+m[1]:(s&&!s.startsWith('@')?'@'+s:s); };
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------------- Store ---------------- */
const LS_KEY = 'smm-crm-data-v1';
const S = { mode:'loading', db:null, data:{}, ready:false, loadWarn:false, readOnly:false, lsBroken:false, localPending:0 };
COLLS.forEach(c=>S.data[c]=new Map());
const all = c => [...S.data[c].values()];
const get = (c,id) => S.data[c].get(id);

function lsRead(){ try{ const raw=localStorage.getItem(LS_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function lsWrite(){
  if(S.mode!=='local') return;
  const o={version:1,savedAt:nowISO()}; COLLS.forEach(c=>o[c]=all(c));
  try{ localStorage.setItem(LS_KEY,JSON.stringify(o)); S.lsBroken=false; }
  catch(e){ S.lsBroken=true; toast('Il browser non permette di salvare: esporta subito un backup dalla sezione Dati e backup.','bad'); }
}
function countLocal(){ const o=lsRead(); if(!o) return 0; return COLLS.reduce((n,c)=>n+((o[c]||[]).length),0); }

async function initStore(){
  let db=null;
  try{ if(window.claude && typeof window.claude.use==='function') db=await window.claude.use('db'); }catch(e){ db=null; }
  if(db){
    S.mode='db'; S.db=db;
    const pending=new Set(COLLS);
    const timer=setTimeout(()=>{ if(pending.size){ S.loadWarn=true; S.ready=true; scheduleRender(); } },10000);
    COLLS.forEach(c=>{
      db.collection(c).onSnapshot(snap=>{
        const m=new Map(); snap.docs.forEach(d=>{ if(d.exists){ m.set(d.id,Object.assign({},d.data(),{id:d.id})); } });
        S.data[c]=m;
        if(!snap.metadata.fromCache){ pending.delete(c); }
        if(!pending.size){ clearTimeout(timer); S.loadWarn=false; S.ready=true; }
        scheduleRender();
      }, err=>{
        pending.delete(c); S.dbError=err&&err.code||'unavailable'; S.ready=true;
        if(!pending.size) clearTimeout(timer);
        scheduleRender();
      });
    });
  } else {
    S.mode='local';
    const o=lsRead();
    if(o) COLLS.forEach(c=>(o[c]||[]).forEach(r=>{ if(r&&r.id) S.data[c].set(r.id,r); }));
    S.ready=true; scheduleRender();
  }
}

const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function dbCall(fn){
  try{ return await fn(); }
  catch(e){
    if(e && e.code==='unavailable'){ await sleep(400+Math.random()*800); return await fn(); }
    throw e;
  }
}
function writeErrorMsg(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){ S.readOnly=true; return 'Modifica non salvata: non hai i permessi di scrittura su questo CRM oppure i dati non sono validi.'; }
  if(c==='quota_exceeded') return 'Spazio dell\'archivio esaurito: esporta un backup ed elimina i record non più necessari.';
  if(c==='resource_exhausted') return 'Troppe operazioni ravvicinate: attendi qualche secondo e riprova.';
  if(c==='revoked'||c==='not_granted') return 'Accesso all\'archivio non più disponibile in questa sessione. Ricarica la pagina.';
  return 'Salvataggio non riuscito: controlla la connessione e riprova.';
}
async function saveRec(c, rec, {silent}={}){
  rec = clone(rec);
  if(!rec.id){ rec.id=uid(); rec.createdAt=nowISO(); }
  rec.updatedAt = nowISO();
  const prev = S.data[c].get(rec.id);
  S.data[c].set(rec.id, rec); scheduleRender();
  if(S.mode==='db'){
    const body=clone(rec); delete body.id;
    try{ await dbCall(()=>S.db.collection(c).doc(rec.id).set(body)); }
    catch(e){ if(prev) S.data[c].set(rec.id,prev); else S.data[c].delete(rec.id); scheduleRender(); if(!silent) toast(writeErrorMsg(e),'bad'); throw e; }
  } else lsWrite();
  return rec;
}
async function delRec(c, id){
  const prev = S.data[c].get(id);
  S.data[c].delete(id); scheduleRender();
  if(S.mode==='db'){
    try{ await dbCall(()=>S.db.collection(c).doc(id).delete()); }
    catch(e){ if(prev) S.data[c].set(id,prev); scheduleRender(); toast(writeErrorMsg(e),'bad'); throw e; }
  } else lsWrite();
}
async function bulkSave(items, onProgress){
  // items: [{c, rec}] — records already carry ids
  let done=0, failed=0; const queue=[...items];
  if(S.mode==='local'){
    items.forEach(({c,rec})=>{ S.data[c].set(rec.id,rec); }); lsWrite(); scheduleRender(); return {done:items.length,failed:0};
  }
  async function worker(){
    while(queue.length){
      const {c,rec}=queue.shift(); const body=clone(rec); delete body.id;
      S.data[c].set(rec.id,rec);
      try{ await dbCall(()=>S.db.collection(c).doc(rec.id).set(body)); done++; }
      catch(e){ failed++; S.data[c].delete(rec.id); if(e&&(e.code==='quota_exceeded'||e.code==='invalid_argument'||e.code==='revoked')){ S.lastBulkErr=writeErrorMsg(e); queue.length=0; } }
      onProgress&&onProgress(done+failed, items.length);
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  scheduleRender();
  return {done,failed};
}

function contactName(id){ const c=get('contacts',id); return c?c.company:'Contatto eliminato'; }
const clientForContact = id => all('clients').find(x=>x.contactId===id);
const outstanding = cl => Math.max(0,(+cl.agreedAmount||0)-(+cl.deposit||0)-(+cl.balance||0));
const collected = cl => (+cl.deposit||0)+(+cl.balance||0);
function isOverdueFU(f){ if(f.status!=='da_fare') return false; const n=daysTo(f.date); if(n==null) return false; if(n<0) return true; if(n===0 && f.time && f.time<nowHM()) return true; return false; }
function isContacted(c){ return (SIDX[c.stage]>=2 && c.stage!=='perso') || !!c.lastContact || (c.stage==='perso' && (c.stageHistory||[]).some(h=>SIDX[h.stage]>=2 && h.stage!=='perso')); }
function maxReach(c){
  let m=-1; (c.stageHistory||[]).forEach(h=>{ const i=SIDX[h.stage]; if(i!=null && i<8 && i>m) m=i; });
  const cur=SIDX[c.stage]; if(cur!=null && cur<8 && cur>m) m=cur;
  return m;
}
function computeStats(){
  const contacts=all('contacts'), fus=all('followups'), aps=all('appointments'), qs=all('quotes'), cls=all('clients');
  const today=todayISO(), in7=addDays(today,7);
  const won=contacts.filter(c=>c.stage==='vinto').length, lost=contacts.filter(c=>c.stage==='perso').length;
  const openDeals=contacts.filter(c=>OPEN_STAGES.includes(c.stage));
  const pipelineValue=contacts.filter(c=>c.stage!=='vinto'&&c.stage!=='perso').reduce((s,c)=>s+(+c.potentialValue||0),0);
  const agreed=cls.reduce((s,c)=>s+(+c.agreedAmount||0),0);
  const coll=cls.reduce((s,c)=>s+collected(c),0);
  const quotesSent=qs.filter(q=>q.status!=='preparazione');
  const apsActive=aps.filter(a=>a.status!=='annullato');
  const apsUpcoming=aps.filter(a=>a.status==='programmato' && a.date>=today);
  const due=dueItems(7);
  return {
    total:contacts.length, contacted:contacts.filter(isContacted).length,
    appts:apsActive.length, apptsUpcoming:apsUpcoming.length,
    quotesSent:quotesSent.length, quotesSentValue:quotesSent.reduce((s,q)=>s+(+q.amount||0),0),
    openDeals:openDeals.length, openDealsValue:openDeals.reduce((s,c)=>s+(+c.potentialValue||0),0),
    contracts:cls.length, won, lost,
    pipelineValue, agreed, collected:coll, outstanding:cls.reduce((s,c)=>s+outstanding(c),0),
    conv: contacts.length? won/contacts.length : 0,
    winRate: (won+lost)? won/(won+lost) : 0,
    due: due.length, overdue: due.filter(d=>d.days<0 || d.over).length,
  };
}
function dueItems(horizon){
  const today=todayISO(); const items=[];
  all('followups').forEach(f=>{ if(f.status!=='da_fare') return; const d=daysTo(f.date); if(d==null||d>horizon) return;
    items.push({kind:'fu',id:f.id,date:f.date,time:f.time,days:d,over:isOverdueFU(f),title:`${f.type||'Follow-up'} · ${contactName(f.contactId)}`,sub:f.description||'',ico:'bell'}); });
  all('appointments').forEach(a=>{ if(a.status!=='programmato') return; const d=daysTo(a.date); if(d==null||d>horizon) return;
    items.push({kind:'ap',id:a.id,date:a.date,time:a.time,days:d,over:d<0,title:`Appuntamento · ${contactName(a.contactId)}`,sub:(a.meetingType||'')+(d<0?' · esito da registrare':''),ico:'cal'}); });
  all('quotes').forEach(q=>{ if(q.status!=='inviato'||!q.expiryDate) return; const d=daysTo(q.expiryDate); if(d==null||d>horizon) return;
    items.push({kind:'q',id:q.id,date:q.expiryDate,days:d,over:d<0,title:`Preventivo in scadenza · ${contactName(q.contactId)}`,sub:`${q.service||''} · ${money(q.amount)}`,ico:'file'}); });
  all('contacts').forEach(c=>{ if(!c.nextActionDate||c.stage==='vinto'||c.stage==='perso') return; const d=daysTo(c.nextActionDate); if(d==null||d>horizon) return;
    items.push({kind:'c',id:c.id,date:c.nextActionDate,days:d,over:d<0,title:`${c.nextAction||'Prossima azione'} · ${c.company}`,sub:stageLabel(c.stage),ico:'flag'}); });
  return items.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
}
function lastMonths(n){
  const out=[]; const d=new Date(); d.setDate(1);
  for(let i=n-1;i>=0;i--){ const x=new Date(d.getFullYear(),d.getMonth()-i,1); out.push({key:x.getFullYear()+'-'+pad(x.getMonth()+1),label:MONTHS[x.getMonth()],year:x.getFullYear(),m:x.getMonth()}); }
  return out;
}

function funnel(){

/* ---------------- Charts (SVG) ---------------- */
function niceStep(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return m*p; }
function niceMax(v,isInt){ if(isInt) return Math.max(1,Math.ceil(v/4))*4; return v<=0?4:niceStep(v/4)*4; }
function chartFrame(w,h,max,fmt){
  const L=fmt===moneyShort?52:30, R=8, T=10, B=24; const iw=w-L-R, ih=h-T-B;
  let g=''; for(let i=0;i<=4;i++){ const v=max*i/4, y=T+ih-ih*i/4; g+=`<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+3.5}" text-anchor="end" font-size="10.5" fill="var(--ink-3)" font-family="var(--f-mono)">${esc(fmt(v))}</text>`; }
  return {L,R,T,B,iw,ih,g};
}
function monthLabels(months,L,iw,h){ const step=iw/months.length; const every=iw<420?2:1; return months.map((m,i)=> (i%every && i!==months.length-1)?'':`<text x="${L+step*i+step/2}" y="${h-6}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)">${m.label}${m.m===0||i===0?" '"+String(m.year).slice(2):''}</text>`).join(''); }
function barChart(el, months, series, fmt){
  const w=Math.max(260,el.clientWidth), h=220;
  const max=niceMax(Math.max(0,...series.flatMap(s=>s.values)),fmt!==moneyShort);
  const f=chartFrame(w,h,max,fmt);
  const step=f.iw/months.length; const groupW=Math.min(step*0.7, series.length*22); const bw=(groupW-(series.length-1)*2)/series.length;
  let bars='', hits='';
  months.forEach((m,i)=>{
    const x0=f.L+step*i+(step-groupW)/2;
    series.forEach((s,j)=>{ const v=s.values[i]; if(!v) return; const bh=Math.max(1,f.ih*v/max); const x=x0+j*(bw+2), y=f.T+f.ih-bh; const r=Math.min(4,bw/2,bh);
      bars+=`<path d="M${x},${y+bh} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${y+bh} Z" fill="${s.color}"/>`; });
    const tip=`<b>${m.label} ${m.year}</b>`+series.map(s=>`<br><span class=&quot;sw&quot; style=&quot;background:${s.color}&quot;></span>${esc(s.name)}: ${esc(s.fmt?s.fmt(s.values[i]):fmt(s.values[i]))}`).join('');
    hits+=`<rect x="${f.L+step*i}" y="${f.T}" width="${step}" height="${f.ih}" fill="transparent" data-tip="${tip}"/>`;
  });
  const empty=series.every(s=>s.values.every(v=>!v));
  el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(series.map(s=>s.name).join(', '))}">${f.g}<line x1="${f.L}" x2="${w-f.R}" y1="${f.T+f.ih}" y2="${f.T+f.ih}" stroke="var(--line-strong)"/>${bars}${monthLabels(months,f.L,f.iw,h)}${hits}</svg>${empty?'<div class="chart-empty">Nessun dato nel periodo</div>':''}`;
}
function lineChart(el, months, series, fmt){
  const w=Math.max(260,el.clientWidth), h=220;
  const max=niceMax(Math.max(0,...series.flatMap(s=>s.values)),fmt!==moneyShort);
  const f=chartFrame(w,h,max,fmt);
  const step=f.iw/months.length; const X=i=>f.L+step*i+step/2; const Y=v=>f.T+f.ih-f.ih*v/max;
  let lines='', hits='';
  series.forEach(s=>{ const d=s.values.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
    lines+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li=s.values.length-1; lines+=`<circle cx="${X(li)}" cy="${Y(s.values[li])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; });
  months.forEach((m,i)=>{
    const tip=`<b>${m.label} ${m.year}</b>`+series.map(s=>`<br><span class=&quot;sw&quot; style=&quot;background:${s.color}&quot;></span>${esc(s.name)}: ${s.values[i]}`).join('');
    hits+=`<g class="hit"><line x1="${X(i)}" x2="${X(i)}" y1="${f.T}" y2="${f.T+f.ih}" stroke="var(--ink-3)" stroke-dasharray="3 3" opacity="0"/><rect x="${f.L+step*i}" y="${f.T}" width="${step}" height="${f.ih}" fill="transparent" data-tip="${tip}"/></g>`;
  });
  const empty=series.every(s=>s.values.every(v=>!v));
  el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Evoluzione trattative">${f.g}${lines}${monthLabels(months,f.L,f.iw,h)}${hits}</svg>${empty?'<div class="chart-empty">Nessun cambio di fase registrato nel periodo</div>':''}`;
  $$('.hit',el).forEach(g=>{ g.addEventListener('mouseenter',()=>g.firstChild.setAttribute('opacity','1')); g.addEventListener('mouseleave',()=>g.firstChild.setAttribute('opacity','0')); });
}
function drawCharts(){
  const months=lastMonths(12); const idx=Object.fromEntries(months.map((m,i)=>[m.key,i]));
  const z=()=>months.map(()=>0);
  const leads=z(), potential=z(), wonVal=z(), opened=z(), won=z(), lost=z();
  all('contacts').forEach(c=>{
    const i=idx[mk(c.acquisitionDate)]; if(i!=null){ leads[i]++; potential[i]+=(+c.potentialValue||0); }
    const hist=(c.stageHistory||[]).slice().sort((a,b)=>String(a.at).localeCompare(String(b.at)));
    const fo=hist.find(hh=>SIDX[hh.stage]>=3 && hh.stage!=='perso'); if(fo){ const k=idx[mk(isoOf(new Date(fo.at)))]; if(k!=null) opened[k]++; }
    const fw=hist.filter(hh=>hh.stage==='vinto').pop(); if(fw&&c.stage==='vinto'){ const k=idx[mk(isoOf(new Date(fw.at)))]; if(k!=null) won[k]++; }
    const fl=hist.filter(hh=>hh.stage==='perso').pop(); if(fl&&c.stage==='perso'){ const k=idx[mk(isoOf(new Date(fl.at)))]; if(k!=null) lost[k]++; }
  });
  all('clients').forEach(cl=>{ const i=idx[mk(cl.acquisitionDate)]; if(i!=null) wonVal[i]+=(+cl.agreedAmount||0); });
  const intFmt=v=>String(Math.round(v*10)/10).replace('.',',');
  const el1=$('[data-chart="leads"]'); if(el1) barChart(el1,months,[{name:'Nuovi contatti',color:'var(--bar)',values:leads}],intFmt);
  const el2=$('[data-chart="deals"]'); if(el2) lineChart(el2,months,[{name:'Nuove trattative',color:'var(--s1)',values:opened},{name:'Vinte',color:'var(--s3)',values:won},{name:'Perse',color:'var(--s2)',values:lost}],intFmt);
  const el3=$('[data-chart="value"]'); if(el3) barChart(el3,months,[{name:'Valore potenziale nuovi lead',color:'var(--bar-2)',values:potential,fmt:money},{name:'Contratti acquisiti',color:'var(--bar)',values:wonVal,fmt:money}],moneyShort);
}

function uniq(arr){ return [...new Set(arr.filter(Boolean).map(s=>String(s).trim()))].sort((a,b)=>a.localeCompare(b,'it')); }
function sortBy(list, key, dir, getter){
  const g=getter||(r=>r[key]); const m=dir==='asc'?1:-1;
  return list.sort((a,b)=>{ let x=g(a), y=g(b); const ex=(x==null||x===''), ey=(y==null||y===''); if(ex&&ey) return 0; if(ex) return 1; if(ey) return -1;
    if(typeof x==='number'&&typeof y==='number') return (x-y)*m; return String(x).localeCompare(String(y),'it',{numeric:true})*m; });
}
function th(view,key,label,cls=''){ const st=UI[view]; const on=st.sort===key; return `<th class="sortable ${cls}" data-act="sort" data-view="${view}" data-key="${key}">${label}${on?`<span class="arr">${st.dir==='asc'?'▲':'▼'}</span>`:''}</th>`; }
function filterContacts(){

}

/* ---------------- Appointments ---------------- */
function vAppointments(){
  if(!UI.appointments.month) UI.appointments.month=todayISO().slice(0,7);
  const [y,m]=UI.appointments.month.split('-').map(Number);
  const first=new Date(y,m-1,1); const start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const aps=all('appointments'); const fus=all('followups').filter(f=>f.status==='da_fare');
  const byDay={}; aps.forEach(a=>{ (byDay[a.date]=byDay[a.date]||[]).push({k:'a',r:a}); }); fus.forEach(f=>{ (byDay[f.date]=byDay[f.date]||[]).push({k:'f',r:f}); });
  const today=todayISO();
  let cells=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const iso=isoOf(d);
    if(i>=35 && d.getMonth()!==m-1) break;
    const evs=(byDay[iso]||[]).sort((a,b)=>(a.k===b.k?0:a.k==='a'?-1:1)||String(a.r.time||'').localeCompare(String(b.r.time||'')));
    cells+=`<div class="day ${d.getMonth()!==m-1?'out':''} ${iso===today?'today':''}" data-act="calDay" data-date="${iso}"><div class="dn"><b>${d.getDate()}</b></div>
    ${evs.slice(0,3).map(e=>e.k==='a'?`<button class="ev ${e.r.status==='annullato'?'cancel':e.r.status==='svolto'?'donee':''}" data-act="edit" data-c="appointments" data-id="${e.r.id}" title="${esc((e.r.time||'')+' '+contactName(e.r.contactId))}">${esc(e.r.time||'')} ${esc(contactName(e.r.contactId))}</button>`:`<button class="ev fu" data-act="edit" data-c="followups" data-id="${e.r.id}" title="Follow-up: ${esc(contactName(e.r.contactId))}">↻ ${esc(contactName(e.r.contactId))}</button>`).join('')}
    ${evs.length>3?`<span class="ev-more">+${evs.length-3}</span>`:''}</div>`;
  }
  const upcoming=sortBy(aps.filter(a=>a.date>=today&&a.status==='programmato'),'date','asc',a=>a.date+a.time);
  const past=sortBy(aps.filter(a=>!(a.date>=today&&a.status==='programmato')),'date','desc',a=>a.date+(a.time||''));
  const toRecord=aps.filter(a=>a.status==='programmato'&&a.date<today).length;
  const monthName=first.toLocaleDateString('it-IT',{month:'long',year:'numeric'});
  return `${storageBanner()}<div class="page-head"><div><h1>Appuntamenti</h1><p>${upcoming.length} in programma${toRecord?` · <b style="color:var(--warn)">${toRecord} passati senza esito</b>`:''} · i follow-up da fare compaiono in grigio</p></div>
  <div class="row"><button class="btn" data-act="export" data-c="appointments">${icon('down')}Esporta CSV</button><button class="btn primary" data-act="new" data-c="appointments">${icon('plus')}Nuovo appuntamento</button></div></div>
  <div class="cal-head"><h2>${monthName}</h2><button class="btn icon" data-act="calNav" data-d="-1" aria-label="Mese precedente">${icon('left')}</button><button class="btn sm" data-act="calNav" data-d="0">Oggi</button><button class="btn icon" data-act="calNav" data-d="1" aria-label="Mese successivo">${icon('right')}</button></div>
  <div class="cal" style="margin-bottom:20px">${cells}</div>
  <div class="grid-2">
    <div class="card"><div class="card-h"><h2>In programma</h2></div><div class="list" style="margin-top:10px">${upcoming.length?upcoming.map(apRow).join(''):'<div class="empty" style="padding:24px">Nessun appuntamento in programma.</div>'}</div></div>
    <div class="card"><div class="card-h"><h2>Storico ed esiti</h2></div><div class="list" style="margin-top:10px">${past.length?past.slice(0,30).map(apRow).join(''):'<div class="empty" style="padding:24px">Ancora nessun incontro passato.</div>'}</div></div>
  </div>`;
}
function apRow(a){
  const d=daysTo(a.date); const needs=a.status==='programmato'&&d<0;
  const st=a.status==='svolto'?`<span class="pill ok">Svolto</span>`:a.status==='annullato'?'<span class="pill">Annullato</span>':a.status==='rinviato'?'<span class="pill warn">Rinviato</span>':needs?'<span class="pill warn">Esito da registrare</span>':`<span class="pill ${d===0?'warn':''}">${relDay(d)}</span>`;
  return `<div class="li li-click" data-act="edit" data-c="appointments" data-id="${a.id}"><div class="ico">${icon(a.meetingType==='Videochiamata'?'video':a.meetingType==='Telefonata'?'phone':'pin')}</div>
  <div style="min-width:0"><div class="t">${esc(contactName(a.contactId))}</div><div class="s">${fmtDateLong(a.date)} · ${esc(a.time||'')} · ${esc(a.meetingType||'')}${a.outcomeTag?' · '+esc(a.outcomeTag):''}</div></div>${st}</div>`;
}

function contactOptions(sel){

}
function fieldHtml(fd, v){
  if(fd.type==='section') return `<div class="form-sec">${fd.label}</div>`;
  const id='f_'+fd.key; const req=fd.req?'<span class="req"> *</span>':'';
  let input;
  switch(fd.type){
    case 'textarea': input=`<textarea class="input" id="${id}" name="${fd.key}" placeholder="${esc(fd.ph||'')}">${esc(v)}</textarea>`; break;
    case 'select': { const opts=[...fd.options]; if(v&&!opts.includes(v)) opts.push(v); input=`<select class="select" id="${id}" name="${fd.key}">${fd.req?'':'<option value="">—</option>'}${opts.filter(o=>o!=='').map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`; break; }
    case 'status': input=`<select class="select" id="${id}" name="${fd.key}">${fd.options.map(o=>`<option value="${o.k}" ${o.k===v?'selected':''}>${o.l}</option>`).join('')}</select>`; break;
    case 'stage': input=`<select class="select" id="${id}" name="${fd.key}">${STAGES.map(o=>`<option value="${o.k}" ${o.k===v?'selected':''}>${o.l}</option>`).join('')}</select>`; break;
    case 'contact': input=`<select class="select" id="${id}" name="${fd.key}">${contactOptions(v)}</select>`; break;
    case 'money': input=`<input class="input num" id="${id}" name="${fd.key}" inputmode="decimal" placeholder="0" value="${v===''||v==null?'':esc(String(v).replace('.',','))}">`; break;
    case 'date': input=`<input class="input" type="date" id="${id}" name="${fd.key}" value="${esc(v)}">`; break;
    case 'time': input=`<input class="input" type="time" id="${id}" name="${fd.key}" value="${esc(v)}">`; break;
    default: input=`<input class="input" type="${fd.type==='email'?'email':fd.type==='tel'?'tel':'text'}" id="${id}" name="${fd.key}" value="${esc(v)}" placeholder="${esc(fd.ph||'')}" ${fd.list?`list="dl_${fd.list}"`:''} autocomplete="off">`;
  }
  return `<div class="fld ${fd.wide?'wide':''}" data-f="${fd.key}"><label for="${id}">${fd.label}${req}</label>${input}${fd.hint?`<span class="hint">${fd.hint}</span>`:''}<span class="err"></span></div>`;
}
function openForm(c, id, preset={}){

    sc.fields.forEach(fd=>{ if(fd.type==='money'&&data[fd.key]==='') data[fd.key]=null; });
    let out=Object.assign({},rec,data);
    if(c==='contacts'){
      if(!id){ out.stageHistory=[{stage:out.stage,at:nowISO()}]; }
      else if(rec.stage!==out.stage){ out.stageHistory=[...(rec.stageHistory||[]),{stage:out.stage,at:nowISO(),from:rec.stage}]; }

    if(preset.quoteId) out.quoteId=preset.quoteId;

      if(c==='contacts'&&!id) { UI.drawer={type:'contact',id:saved.id}; scheduleRender(); }

    }catch(err){ if(btn) btn.disabled=false; }

const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function validate(c,d){
  const e={}; const sc=SCHEMA[c];
  sc.fields.forEach(fd=>{
    const v=d[fd.key]; if(fd.type==='section') return;
    if(fd.req && (v===''||v==null||(typeof v==='number'&&isNaN(v)))){ e[fd.key]='Campo obbligatorio'; return; }
    if(v===''||v==null) return;
    if(fd.type==='email'&&!EMAIL_RE.test(v)) e[fd.key]='Email non valida';
    if(fd.type==='money'){ if(isNaN(v)) e[fd.key]='Inserisci un importo numerico, es. 1500 o 1.500,50'; else if(v<0) e[fd.key]='L\'importo non può essere negativo'; }
    if(fd.type==='date'&&!parseISO(v)) e[fd.key]='Data non valida';
    if(fd.type==='contact'&&!get('contacts',v)) e[fd.key]='Contatto non trovato';
    if(fd.type==='tel'&&!/^[+\d\s().\/-]{5,}$/.test(v)) e[fd.key]='Numero non valido';
  });
  if(c==='quotes'){
    if(!e.amount&&d.amount<=0) e.amount='L\'importo deve essere maggiore di zero';
    if(d.status!=='preparazione'&&!d.sentDate) e.sentDate='Indica la data di invio';
    if(d.sentDate&&d.expiryDate&&d.expiryDate<d.sentDate) e.expiryDate='La scadenza è precedente alla data di invio';
  }
  if(c==='clients'){
    const ag=+d.agreedAmount||0, dep=+d.deposit||0, bal=+d.balance||0;
    if(!e.agreedAmount&&ag<=0) e.agreedAmount='Inserisci l\'importo concordato';
    if(!e.deposit&&!e.balance&&dep+bal>ag+0.001) e.balance='Acconto + saldo superano l\'importo concordato';
    if(dep>0&&!d.depositDate) e.depositDate='Indica quando hai ricevuto l\'acconto';
    if(bal>0&&!d.balanceDate) e.balanceDate='Indica quando hai ricevuto il saldo';
  }
  if(c==='contacts'){
    if(d.nextAction&&!d.nextActionDate) e.nextActionDate='Indica entro quando';
    if(d.lastContact&&d.lastContact>todayISO()) e.lastContact='L\'ultimo contatto non può essere nel futuro';
  }
  return e;
}
function openClientFromContact(contactId, extra={}){
  const ct=get('contacts',contactId); if(!ct) return;
  openForm('clients',null,Object.assign({contactId,company:ct.company,contactName:ct.contactName||'',email:ct.email||'',phone:ct.phone||'',services:ct.service||'',agreedAmount:ct.potentialValue||''},extra));

function toast(msg,kind='',action){
  const el=document.createElement('div'); el.className='toast '+(kind||'');
  el.innerHTML=`<span>${esc(msg)}</span>`;
  if(action){ const b=document.createElement('button'); b.textContent=action.label; b.onclick=()=>{ action.fn(); el.remove(); }; el.appendChild(b); }
  $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(), action?7000:kind==='bad'?7000:3200);
}
async function copyText(v){
  try{ await navigator.clipboard.writeText(v); toast('Copiato: '+v); }

/* ---------------- CSV ---------------- */
function csvCell(v){ v=v==null?'':String(v); return /[;"\n\r,]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function toCSV(rows){ return '﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'); }
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const firstLine=text.split(/\r?\n/,1)[0]||'';
  const counts={';':0,',':0,'\t':0}; let inq=false; for(const ch of firstLine){ if(ch==='"') inq=!inq; else if(!inq&&ch in counts) counts[ch]++; }
  const delim=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=ch;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function exportCols(c){
  const cols=SCHEMA[c].fields.filter(f=>f.type!=='section').map(f=>({key:f.key,label:f.type==='contact'?(c==='clients'?'Contatto collegato':'Cliente'):f.label,fd:f}));
  if(c==='clients') cols.push({key:'_out',label:'Da incassare (€)',calc:r=>outstanding(r)});
  return cols;
}
function cellOut(fd,v){
  if(v==null||v==='') return '';
  switch(fd.type){
    case 'money': return String(v).replace('.',',');
    case 'date': return fmtDate(v);
    case 'contact': return contactName(v);
    case 'stage': return stageLabel(v);
    case 'status': return lbl(fd.options,v);
    default: return v;
  }
}
function buildCSV(c,list){
  const cols=exportCols(c);
  const rows=[cols.map(x=>x.label)];
  list.forEach(r=>rows.push(cols.map(x=>x.calc?String(x.calc(r)).replace('.',','):cellOut(x.fd,r[x.key]))));
  return toCSV(rows);
}
async function offerFile(filename,data,mime){
  let dl=null; try{ dl=await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename,data:new Blob([data],{type:mime})}); toast('File pronto: '+filename); return; }
    catch(e){ if(e&&(e.code==='declined'||e.code==='dismissed'||e.code==='cancelled')) return; }
  }
  const m=openModal({title:'Esporta '+filename,wide:true,body:`<p style="margin:0 0 10px;color:var(--ink-2)">Il download diretto non è disponibile in questa visualizzazione. Copia il contenuto e incollalo in un file chiamato <b>${esc(filename)}</b>.</p><textarea class="input mono" id="exportText" style="width:100%;min-height:280px;font-size:12px" readonly>${esc(data.replace(/^﻿/,''))}</textarea>`,
    footer:`<button class="btn" data-m="close">Chiudi</button><button class="btn primary" data-m="copy">${icon('copy')}Copia tutto</button>`});
  $('[data-m="close"]',m.parentElement).onclick=closeModal;
  $('[data-m="copy"]',m.parentElement).onclick=async()=>{ const t=$('#exportText'); try{ await navigator.clipboard.writeText(t.value); toast('Contenuto copiato'); }catch(e){ t.focus(); t.select(); toast('Seleziona tutto e copia con Ctrl/Cmd + C'); } };
}
const stamp=()=>todayISO();
function exportCSV(c,filtered){
  let list=all(c);

  if(!list.length){ toast('Non ci sono dati da esportare','bad'); return; }
  offerFile(`smm-crm-${{contacts:'contatti',followups:'follow-up',appointments:'appuntamenti',quotes:'preventivi',clients:'clienti-acquisiti'}[c]}-${stamp()}.csv`,buildCSV(c,list),'text/csv;charset=utf-8');
}
function exportTemplate(c){ offerFile(`modello-${SCHEMA[c].name.toLowerCase().replace(/\s+/g,'-')}.csv`,toCSV([exportCols(c).filter(x=>!x.calc).map(x=>x.label)]),'text/csv;charset=utf-8'); }
function pickFile(accept,cb){
  const inp=document.createElement('input'); inp.type='file'; inp.accept=accept; inp.style.display='none';
  inp.onchange=()=>{ const f=inp.files[0]; inp.remove(); if(!f) return; if(f.size>15*1024*1024){ toast('File troppo grande (max 15 MB)','bad'); return; } const r=new FileReader(); r.onload=()=>cb(String(r.result),f.name); r.onerror=()=>toast('Impossibile leggere il file','bad'); r.readAsText(f,'utf-8'); };
  document.body.appendChild(inp); inp.click();
}
function importCSV(c){
  pickFile('.csv,text/csv,.txt',(text,name)=>{
    let rows; try{ rows=parseCSV(text); }catch(e){ toast('CSV non leggibile','bad'); return; }
    if(rows.length<2){ toast('Il file non contiene righe di dati','bad'); return; }
    const head=rows[0].map(keyNorm);
    const cols=exportCols(c).filter(x=>!x.calc);
    const map=cols.map(col=>{ let i=head.indexOf(keyNorm(col.label)); if(i<0) i=head.indexOf(keyNorm(col.key)); if(i<0&&col.fd.type==='contact'){ i=['cliente','contatto','azienda','nomeazienda','contattocollegato','company'].map(h=>head.indexOf(h)).find(x=>x>=0); if(i==null) i=-1; } if(i<0&&col.fd.type==='stage'){ i=head.indexOf('fase'); } return {col,i}; });
    const matched=map.filter(m=>m.i>=0);
    const missingReq=cols.filter(x=>x.fd.req&&!(x.fd.def)&&!matched.some(m=>m.col.key===x.key));
    const results=[]; const errors=[];
    const existing=new Set(all('contacts').map(x=>keyNorm(x.company)+'|'+norm(x.email)));
    let dups=0;
    rows.slice(1).forEach((r,ri)=>{
      const d={}; const rowErr=[];
      matched.forEach(({col,i})=>{
        const raw=(r[i]||'').trim(); const fd=col.fd; let v=raw;
        if(raw==='') { v=''; }
        else if(fd.type==='money'){ v=parseNum(raw); if(isNaN(v)) rowErr.push(`${fd.label}: "${raw}" non è un importo`); }
        else if(fd.type==='date'){ v=parseAnyDate(raw); if(v===null){ rowErr.push(`${fd.label}: "${raw}" non è una data`); v=''; } }
        else if(fd.type==='stage'){ const s=STAGES.find(s=>keyNorm(s.l)===keyNorm(raw)||s.k===raw); v=s?s.k:'nuovo'; if(!s) rowErr.push(`Fase "${raw}" non riconosciuta, impostata a Nuovo lead`); }
        else if(fd.type==='status'){ const s=fd.options.find(s=>keyNorm(s.l)===keyNorm(raw)||s.k===raw); v=s?s.k:fd.def; }
        else if(fd.type==='contact'){ const ct=all('contacts').find(x=>keyNorm(x.company)===keyNorm(raw)); v=ct?ct.id:''; if(!ct&&fd.req) rowErr.push(`Contatto "${raw}" non trovato: importa prima i contatti`); }
        d[col.key]=v;
      });
      cols.forEach(col=>{ const fd=col.fd; if((d[col.key]===undefined||d[col.key]==='')&&fd.def!=null){ d[col.key]=typeof fd.def==='function'?fd.def():fd.def; } if(d[col.key]===undefined) d[col.key]=fd.type==='money'?null:''; });
      const ve=validate(c,Object.fromEntries(Object.entries(d).map(([k,v])=>[k,v==null?'':v])));
      // relaxed rules on import: missing payment dates or next action date are not blocking
      delete ve.depositDate; delete ve.balanceDate; delete ve.nextActionDate;
      Object.entries(ve).forEach(([k,msg])=>{ const fd=cols.find(x=>x.key===k); rowErr.push(`${fd?fd.fd.label:k}: ${msg}`); });
      const blocking=rowErr.filter(x=>!/impostata a Nuovo lead/.test(x));
      if(blocking.length){ errors.push(`Riga ${ri+2}: ${blocking.join('; ')}`); return; }
      if(c==='contacts'){ const k=keyNorm(d.company)+'|'+norm(d.email); if(existing.has(k)){ dups++; return; } existing.add(k); }
      const now=nowISO();
      const rec=Object.assign({id:uid(),createdAt:now,updatedAt:now},d);
      if(c==='contacts') rec.stageHistory=[{stage:rec.stage||'nuovo',at:now,imported:true}];
      results.push(rec);
    });
    const m=openModal({title:`Importa ${SCHEMA[c].name.toLowerCase()} da ${name}`,wide:true,body:`
      <p style="margin:0 0 8px">Righe nel file: <b>${rows.length-1}</b> · pronte all'importazione: <b>${results.length}</b>${errors.length?` · con errori: <b style="color:var(--bad)">${errors.length}</b>`:''}${dups?` · duplicati saltati (stessa azienda ed email): <b>${dups}</b>`:''}</p>
      <p class="cell-sub" style="margin:0 0 6px">Colonne riconosciute: ${matched.map(m=>esc(m.col.label)).join(', ')||'nessuna'}</p>
      ${missingReq.length?`<div class="note bad" style="margin:8px 0">${icon('alert')}<div>Manca la colonna obbligatoria: ${missingReq.map(x=>esc(x.label)).join(', ')}. Scarica il modello vuoto da Dati e backup per vedere le intestazioni attese.</div></div>`:''}
      ${errors.length?`<div class="import-errs">${errors.slice(0,100).map(esc).join('<br>')}${errors.length>100?'<br>…':''}</div>`:''}
      ${results.length?`<div class="tbl-wrap" style="margin-top:12px;max-height:240px"><table class="tbl csv-tbl"><thead><tr>${matched.slice(0,5).map(m=>`<th>${esc(m.col.label)}</th>`).join('')}</tr></thead><tbody>${results.slice(0,8).map(r=>`<tr style="cursor:default">${matched.slice(0,5).map(m=>`<td>${esc(cellOut(m.col.fd,r[m.col.key]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}
      <p class="cell-sub" id="impProg" style="margin:10px 0 0"></p>`,
      footer:`<button class="btn" data-m="close">Annulla</button><button class="btn primary" data-m="go" ${results.length?'':'disabled'}>Importa ${results.length} righe</button>`});
    const f=m.parentElement;
    $('[data-m="close"]',f).onclick=closeModal;
    $('[data-m="go"]',f).onclick=async(e)=>{
      e.target.disabled=true; S.lastBulkErr=null;
      const res=await bulkSave(results.map(rec=>({c,rec})),(n,t)=>{ const p=$('#impProg'); if(p) p.textContent=`Salvataggio ${n} di ${t}…`; });
      closeModal();
      toast(res.failed?`Importate ${res.done} righe, ${res.failed} non salvate. ${S.lastBulkErr||''}`:`Importate ${res.done} righe`, res.failed?'bad':'');
    };
  });
}

/* ---------------- JSON backup ---------------- */
function backup(){
  const o={app:'SMM Business CRM',version:1,exportedAt:nowISO()}; COLLS.forEach(c=>o[c]=all(c));
  const n=COLLS.reduce((s,c)=>s+o[c].length,0);
  if(!n){ toast('Non ci sono ancora dati da salvare','bad'); return; }
  offerFile(`smm-crm-backup-${stamp()}.json`,JSON.stringify(o,null,2),'application/json');
}
function restore(){
  pickFile('.json,application/json',(text)=>{
    let o; try{ o=JSON.parse(text); }catch(e){ toast('Il file non è un backup JSON valido','bad'); return; }
    if(!o||typeof o!=='object'||!COLLS.some(c=>Array.isArray(o[c]))){ toast('Il file non contiene dati del CRM','bad'); return; }
    const items=[]; COLLS.forEach(c=>(o[c]||[]).forEach(r=>{ if(r&&typeof r==='object'){ const rec=clone(r); if(!rec.id||!/^[A-Za-z0-9_.~:@+-]{1,120}$/.test(rec.id)||rec.id==='.'||rec.id==='..') rec.id=uid(); items.push({c,rec}); } }));
    const counts=COLLS.map(c=>`${SCHEMA[c].name}: ${(o[c]||[]).length}`).join(' · ');
    const m=openModal({title:'Ripristina backup',body:`<p style="margin:0 0 10px">Il file contiene ${items.length} record.<br><span class="cell-sub">${esc(counts)}${o.exportedAt?' · esportato il '+new Date(o.exportedAt).toLocaleString('it-IT'):''}</span></p>
      <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px"><input type="radio" name="rmode" value="merge" checked> <span><b>Unisci</b><br><span class="cell-sub">Aggiunge i record e aggiorna quelli con lo stesso identificativo. Non elimina nulla.</span></span></label>
      <label style="display:flex;gap:8px;align-items:flex-start"><input type="radio" name="rmode" value="replace"> <span><b>Sostituisci tutto</b><br><span class="cell-sub">Elimina i dati attuali e li sostituisce con quelli del backup.</span></span></label>
      <p class="cell-sub" id="impProg" style="margin:10px 0 0"></p>`,
      footer:`<button class="btn" data-m="close">Annulla</button><button class="btn primary" data-m="go">Ripristina</button>`});
    const f=m.parentElement; $('[data-m="close"]',f).onclick=closeModal;
    $('[data-m="go"]',f).onclick=async(e)=>{
      e.target.disabled=true; const mode=$('input[name="rmode"]:checked',f).value;
      if(mode==='replace'){ for(const c of COLLS){ for(const r of all(c)){ try{ await delRec(c,r.id); }catch(err){ closeModal(); return; } } } }
      S.lastBulkErr=null;
      const res=await bulkSave(items,(n,t)=>{ const p=$('#impProg'); if(p) p.textContent=`Ripristino ${n} di ${t}…`; });
      closeModal(); toast(res.failed?`Ripristinati ${res.done} record, ${res.failed} non salvati. ${S.lastBulkErr||''}`:`Ripristinati ${res.done} record`,res.failed?'bad':'');
    };
  });
}
async function migrateLocal(){
  const o=lsRead(); if(!o) return;
  const items=[]; COLLS.forEach(c=>(o[c]||[]).forEach(r=>{ if(r&&r.id&&!get(c,r.id)) items.push({c,rec:clone(r)}); }));
  if(!items.length){ toast('Tutti i record locali sono già nell\'archivio'); return; }
  const res=await bulkSave(items);
  toast(res.failed?`Copiati ${res.done} record, ${res.failed} non riusciti`:`Copiati ${res.done} record nell'archivio online`,res.failed?'bad':'');
}
function wipe(){
  const extra=`<label style="display:block;margin-top:12px;font-size:13px">Scrivi <b>ELIMINA</b> per confermare<input class="input" name="word" style="width:100%;margin-top:6px" autocomplete="off"></label>`;

/* ---------------- Global search ---------------- */
let srSel=-1, srItems=[];
function runSearch(q){
  const box=$('#searchResults'); q=norm(q);
  if(q.length<2){ box.hidden=true; srItems=[]; return; }
  const hit=(...v)=>norm(v.join(' ')).includes(q);
  const groups=[
    ['Contatti',all('contacts').filter(c=>hit(c.company,c.contactName,c.email,c.phone,c.sector,c.location,c.instagram,c.website,c.notes)).slice(0,8).map(c=>({act:'openContact',id:c.id,t:c.company,s:[c.contactName,stageLabel(c.stage),c.location].filter(Boolean).join(' · '),i:'users'}))],
    ['Clienti acquisiti',all('clients').filter(c=>hit(c.company,c.contactName,c.services,c.vat,c.email)).slice(0,5).map(c=>({act:'openClient',id:c.id,t:c.company,s:c.services+' · '+money(c.agreedAmount),i:'brief'}))],
    ['Preventivi',all('quotes').filter(x=>hit(contactName(x.contactId),x.service,x.number,x.notes)).slice(0,5).map(x=>({act:'edit',c:'quotes',id:x.id,t:contactName(x.contactId)+' · '+(x.service||''),s:money(x.amount)+' · '+lbl(Q_STATUS,x.status),i:'file'}))],
    ['Follow-up',all('followups').filter(x=>hit(contactName(x.contactId),x.description,x.type)).slice(0,5).map(x=>({act:'edit',c:'followups',id:x.id,t:(x.type||'')+' · '+contactName(x.contactId),s:fmtDate(x.date)+' · '+lbl(FU_STATUS,x.status),i:'bell'}))],
    ['Appuntamenti',all('appointments').filter(x=>hit(contactName(x.contactId),x.notes,x.outcome,x.meetingType,x.place)).slice(0,5).map(x=>({act:'edit',c:'appointments',id:x.id,t:contactName(x.contactId),s:fmtDate(x.date)+' '+(x.time||'')+' · '+lbl(AP_STATUS,x.status),i:'cal'}))],
  ].filter(g=>g[1].length);
  srItems=groups.flatMap(g=>g[1]); srSel=srItems.length?0:-1;
  let k=0;
  box.innerHTML=groups.length?groups.map(([n,items])=>`<div class="sr-group">${n}</div>`+items.map(it=>`<button class="sr-item ${k===srSel?'sel':''}" data-k="${k++}">${icon(it.i)}<span style="min-width:0"><span>${esc(it.t)}</span><small>${esc(it.s)}</small></span></button>`).join('')).join(''):`<div class="empty" style="padding:18px">Nessun risultato per “${esc(q)}”</div>`;
  box.hidden=false;

/* ---------------- Events ---------------- */
document.addEventListener('click',async e=>{

  if(!e.target.closest('#searchBox')) $('#searchResults').hidden=true;

  if(t.tagName==='A'&&a!=='closeDrawerBg') e.preventDefault();
  e.stopPropagation();
  switch(a){
    case 'new': { const pre={}; if(t.dataset.contact) pre.contactId=t.dataset.contact; if(t.dataset.date) pre.date=t.dataset.date; openForm(c,null,pre); break; }
    case 'edit': openForm(c,id); break;
    case 'del': askDelete(c,id); break;
    case 'delContact': askDeleteContact(id); break;
    case 'openContact': if(get('contacts',id)) openDrawer('contact',id); break;
    case 'openClient': openDrawer('client',id); break;
    case 'closeDrawer': UI.drawer=null; renderDrawer(); break;
    case 'sort': { const st=UI[t.dataset.view]; const k=t.dataset.key; if(st.sort===k) st.dir=st.dir==='asc'?'desc':'asc'; else { st.sort=k; st.dir=/Date|amount|Amount|potential|budget|deposit|balance|out/.test(k)?'desc':'asc'; } scheduleRender(); break; }

    case 'stageStep': { const ct=get('contacts',id); if(!ct) break; const i=SIDX[ct.stage]+(+t.dataset.dir); if(i>=0&&i<STAGES.length) moveStage(id,STAGES[i].k); break; }
    case 'fuTab': UI.followups.tab=t.dataset.tab; scheduleRender(); break;
    case 'qTab': UI.quotes.status=t.dataset.st; scheduleRender(); break;
    case 'fuStatus': { const f=get('followups',id); if(!f) break; try{ await saveRec('followups',Object.assign({},f,{status:t.dataset.st}));
        if(t.dataset.st==='completato'){ const ct=get('contacts',f.contactId); const day=f.date<=todayISO()?f.date:todayISO(); if(ct&&(!ct.lastContact||ct.lastContact<day)) await saveRec('contacts',Object.assign({},ct,{lastContact:day}),{silent:true});
          toast('Follow-up completato','',{label:'Programma il prossimo',fn:()=>openForm('followups',null,{contactId:f.contactId,date:addDays(todayISO(),7),type:f.type})}); }
        else toast(t.dataset.st==='annullato'?'Follow-up annullato':'Follow-up riaperto'); }catch(err){} break; }
    case 'calNav': { const d=+t.dataset.d; if(!d) UI.appointments.month=todayISO().slice(0,7); else { const [y,m]=UI.appointments.month.split('-').map(Number); const x=new Date(y,m-1+d,1); UI.appointments.month=x.getFullYear()+'-'+pad(x.getMonth()+1); } scheduleRender(); break; }
    case 'calDay': openForm('appointments',null,{date:t.dataset.date}); break;
    case 'openDue': { const k=t.dataset.kind; if(k==='fu') openForm('followups',id); else if(k==='ap') openForm('appointments',id); else if(k==='q') openForm('quotes',id); else openDrawer('contact',id); break; }
    case 'quoteToClient': { const q=get('quotes',id); if(!q) break; const ct=get('contacts',q.contactId); openForm('clients',null,{contactId:q.contactId,company:ct?ct.company:'',contactName:ct?ct.contactName||'':'',email:ct?ct.email||'':'',phone:ct?ct.phone||'':'',services:q.service||'',agreedAmount:q.amount,quoteId:q.id}); break; }
    case 'clientFromContact': openClientFromContact(id); break;

    case 'copy': copyText(t.dataset.v); break;

    case 'template': exportTemplate(c); break;
    case 'import': importCSV(c); break;

    case 'clearLocal': confirmBox({title:'Eliminare la copia locale?',text:'Verranno cancellati solo i dati salvati in questo browser, non quelli dell\'archivio online.',ok:'Elimina copia locale',danger:true,onOk:()=>{ try{ localStorage.removeItem(LS_KEY); }catch(e){} toast('Copia locale eliminata'); scheduleRender(); }}); break;
    case 'wipe': wipe(); break;
  }
});

const tip=$('#tip');
document.addEventListener('mousemove',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t){ tip.hidden=true; return; }
  tip.innerHTML=t.getAttribute('data-tip'); tip.hidden=false;
  const w=tip.offsetWidth, h=tip.offsetHeight; let x=e.clientX+14, y=e.clientY+14;
  if(x+w>innerWidth-8) x=e.clientX-w-14; if(y+h>innerHeight-8) y=e.clientY-h-14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
});
document.addEventListener('scroll',()=>{ tip.hidden=true; },true);
// New menu & side nav
$('#newIco').innerHTML=icon('plus'); $('#searchIcon').outerHTML=icon('search'); $('#menuBtn').innerHTML=icon('menu');
$('#newMenu').innerHTML=[['contacts','users','Contatto / lead'],['followups','bell','Follow-up'],['appointments','cal','Appuntamento'],['quotes','file','Preventivo'],['clients','brief','Cliente acquisito']].map(([c,i,l])=>`<button data-act="new" data-c="${c}">${icon(i)}${l}</button>`).join('');
$('#newBtn').addEventListener('click',e=>{ e.stopPropagation(); $('#newMenu').hidden=!$('#newMenu').hidden; });
$('#newMenu').addEventListener('click',()=>{ $('#newMenu').hidden=true; });
function closeSide(){ $('#side').classList.remove('open'); $('#sideBackdrop').classList.remove('open'); }
$('#menuBtn').addEventListener('click',()=>{ $('#side').classList.add('open'); $('#sideBackdrop').classList.add('open'); });
$('#sideBackdrop').addEventListener('click',closeSide);
$('#nav').addEventListener('click',e=>{ if(e.target.closest('a')) closeSide(); });

/* ---------------- Router ---------------- */
function route(){
  const h=(location.hash||'').replace('#','');
  UI.view=VIEWS.some(v=>v.k===h)?h:'dashboard';
  scheduleRender();
  const v=$('#view'); if(v) window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
let rz=0; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(UI.view==='dashboard') drawCharts(); },150); });
function afterRender(){ if(UI.view==='dashboard') drawCharts(); }
// Refresh relative dates every minute (overdue status) without writing anything
setInterval(()=>{ if(!$('#modalRoot').innerHTML && !document.activeElement.matches('input,textarea,select')) scheduleRender(); },60000);

route();
initStore();
})();
